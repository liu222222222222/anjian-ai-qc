<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月度报告 · 安检抽查系统</title>
<link rel="stylesheet" href="/static/style.css">
<style>
/* ---------- 报告页专用 ---------- */
.sumcard{background:linear-gradient(135deg,#1668dc,#0d4a9e 70%,#0a3f8a);color:#fff;border-radius:14px;
  padding:22px 26px 24px;margin-bottom:20px;box-shadow:0 6px 22px rgba(22,104,220,.20)}
.sumcard h1{margin:0 0 6px;font-size:23px;font-weight:700;letter-spacing:.5px}
.sumcard .sm{opacity:.84;font-size:13.5px;letter-spacing:.2px}
.sumcard .hdline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.18)}

/* 四块分组：抽查范围 / 人工审核 / 问题发现 / 符合率 */
.sumgrid{display:grid;gap:12px;margin-top:16px;
  grid-template-columns:1.05fr .92fr 1.5fr .78fr}
@media(max-width:1180px){.sumgrid{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.sumgrid{grid-template-columns:1fr}}
.sgrp{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.17);
  border-radius:10px;padding:14px 16px 15px}
.sgrp h4{margin:0 0 10px;font-size:12.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;opacity:.74}
.sgrp .kv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0}
.sgrp .kv+.kv{border-top:1px solid rgba(255,255,255,.12)}
.sgrp .kv b{font-size:23px;font-weight:700;line-height:1.25;
  font-variant-numeric:tabular-nums;letter-spacing:.3px}
.sgrp .kv b.xl{font-size:28px}
.sgrp .kv span{font-size:12.5px;opacity:.86;text-align:right;line-height:1.4}
.sgrp .note{display:block;font-size:12px;margin:-1px 0 9px;padding:3px 0 3px 10px;
  border-left:2.5px solid rgba(255,255,255,.42);letter-spacing:.3px;line-height:1.5;font-weight:600}
.sgrp .note.r{border-left-color:#ffb3a3;color:#ffe0d9}
.sgrp .note.y{border-left-color:#ffd97a;color:#fff2c9}
/* 符合率：单独一块，视觉落点 */
.sgrp.res{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.30)}
.sgrp.res b{font-size:37px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.sgrp.res i{font-style:normal;font-size:12.5px;opacity:.86;margin-top:6px;letter-spacing:.3px}
.sgrp.res em{font-style:normal;font-size:11.5px;opacity:.62;margin-top:3px}

.cobox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:17px 20px;margin-bottom:13px;transition:.15s;cursor:pointer;position:relative}
.cobox:hover{border-color:var(--blue);box-shadow:0 3px 12px rgba(22,104,220,.1);transform:translateY(-1px)}
.cobox.off{opacity:.5;cursor:default}
.cobox.off:hover{border-color:var(--line);box-shadow:none;transform:none}
.cobox .hd{display:flex;align-items:center;gap:11px;margin-bottom:9px;flex-wrap:wrap;padding-right:322px}
.cobox .hd h3{margin:0;font-size:16.5px;font-weight:700}
.cobox .metrics{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
  margin:11px 0 10px}
.cobox .metrics div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:9px 10px;text-align:center}
.cobox .metrics .v{font-size:20px;font-weight:700;line-height:1.2}
.cobox .metrics .l{font-size:10.5px;color:var(--dim);margin-top:2px}
.cobox .txt{color:var(--txt);font-size:13px;line-height:1.9}
.cobox .acts{position:absolute;top:16px;right:18px;display:flex;gap:7px}
.tag2{font-size:11px;padding:2px 9px;border-radius:11px;border:1px solid}
.t-off{background:var(--panel2);color:var(--dim);border-color:var(--line)}
.t-on{background:#f6ffed;color:#237804;border-color:#b7eb8f}
.t-wait{background:var(--yellowbg);color:var(--yellow);border-color:#f0d999}
.v.r{color:var(--red)}.v.y{color:var(--yellow)}.v.g{color:var(--green)}.v.b{color:var(--blue)}.v.d{color:var(--dim)}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
.bar i.r{background:var(--red)}.bar i.y{background:var(--yellow)}.bar i.g{background:var(--green)}
h2.sect{font-size:16px;margin:24px 0 12px;padding-left:10px;border-left:4px solid var(--blue)}
h2.sect small{font-weight:400;color:var(--dim);font-size:11.5px;margin-left:8px}
</style></head><body>

<header>
  <div class="brand">⚡ 安检照片<em>AI质检</em></div>
  <nav>
    <a href="/">总览</a>
    <a href="/live">实时看板</a>
    <a href="/review">人工复核</a>
    <a href="/report" class="on">月度报告</a>
    <a href="/special">专项任务</a>
    <a href="/settings" title="高级设置（待完善）">设置<small style="font-size:11px;color:#9aa5b1;margin-left:2px">待完善</small></a>
  </nav>
  <div class="sp"></div>
</header>

<div class="wrap">
  <div class="card">
    <div class="row c4">
      <div><label>月份</label><select id="month"></select></div>
      <div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap">
        <button class="btn pri" id="btnLoad">查询</button>
        <button class="btn" id="btnDlSum">下载情况说明</button>
        <button class="btn" id="btnImp" title="导入公司填好的 Excel，反馈内容写回人工审核意见">导入公司反馈</button>
        <input type="file" id="impFile" accept=".xlsx" style="display:none">
      </div>
    </div>
    <div class="hint">
      「情况说明」为集团月度汇总，含六家数据与结论；点任一分公司卡片进入该公司报告详情，
      卡片右上角的「下载」导出这家公司报告（图片走安检系统原图链接，文件只有几百KB，需联网看图）；
      「导出Excel」出抽查明细表（一户一行，照片只给链接，末列留空给公司填反馈），
      公司填好回传后点「导入公司反馈」即可写回审核意见。
    </div>
    <div id="dlMsg" style="margin-top:8px"></div>
  </div>

  <div id="sumBox"><div class="hint">读取中…</div></div>

  <h2 class="sect">各分公司情况<small>点卡片进入该公司报告详情</small></h2>
  <div id="compBox"><div class="hint">读取中…</div></div>
</div>

<script>
const $=id=>document.getElementById(id);

function dl(url, btn){
  if(btn){btn.dataset.o=btn.textContent;btn.disabled=true;btn.textContent='生成中…';}
  $('dlMsg').innerHTML='<span class="spin"></span> 正在生成文件并下载…';
  fetch(url).then(r=>{
    if(!r.ok) return r.json().then(j=>{throw new Error(j.msg||r.status)});
    const cd=r.headers.get('Content-Disposition')||'';
    let name='report.html';
    const m=cd.match(/filename\*=UTF-8''([^;]+)/);
    if(m) name=decodeURIComponent(m[1]);
    else { const m2=cd.match(/filename="?([^";]+)/); if(m2) name=m2[1]; }
    return r.blob().then(b=>({b,name}));
  }).then(({b,name})=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    $('dlMsg').innerHTML=`<span class="tag2 t-on">✓ 已下载 ${name}（${b.size>1048576?(b.size/1048576).toFixed(1)+' MB':Math.round(b.size/1024)+' KB'}）</span>`;
  }).catch(e=>{
    $('dlMsg').innerHTML=`<span class="tag2 t-wait">✗ ${e.message||e}</span>`;
  }).finally(()=>{ if(btn){btn.disabled=false;btn.textContent=btn.dataset.o||'下载';} });
}

async function load(){
  $('sumBox').innerHTML='<div class="hint">读取中…</div>';
  $('compBox').innerHTML='<div class="hint">读取中…</div>';
  const m=$('month').value.trim();
  const d=await (await fetch('/api/report/overview?month='+encodeURIComponent(m))).json();
  renderSum(d); renderComp(d);
}

function renderSum(d){
  const s=d.summary;
  const n=v=>(v==null?0:v).toLocaleString();
  const kv=(v,l,xl)=>`<div class="kv"><b class="${xl?'xl':''}">${v}</b><span>${l}</span></div>`;
  const rr=s.review_rate!=null?s.review_rate:(s.sampled?Math.round(s.reviewed*1000/s.sampled)/10:0);
  $('sumBox').innerHTML=`
  <div class="sumcard">
    <div class="hdline">
      <div>
        <h1>燃气入户安检抽查 · 月度情况说明</h1>
        <div class="sm">${d.month?monLabel(d.month):'本月'}
          · 覆盖 ${s.company_count} 家分公司 · 生成于 ${s.generated}</div>
      </div>
    </div>

    <div class="sumgrid">
      <!-- ① 抽查范围：从全量 → 可查 → 实抽 -->
      <div class="sgrp">
        <h4>抽查范围</h4>
        ${kv(n(s.total_house),'当月入户安检总数')}
        ${kv(n(s.checkable_house!=null?s.checkable_house:s.total_house),'符合抽查条件的用户')}
        ${kv((s.done_house!=null&&s.done_house<s.sampled)?(n(s.done_house)+' / '+n(s.sampled)):n(s.sampled),
             (s.done_house!=null&&s.done_house<s.sampled)?'已判定 / 已抽查':'本次抽查数量','1')}
        ${kv(s.rate+'%','抽查覆盖率')}
      </div>

      <!-- ② 人工审核进度 -->
      <div class="sgrp">
        <h4>人工审核</h4>
        ${kv(n(s.reviewed),'已人工审核','1')}
        ${kv(rr+'%','人工审核比例')}
        ${kv(n(s.pending),'待人工审核')}
      </div>

      <!-- ③ 问题发现（重点，带处理口径） -->
      <div class="sgrp">
        <h4>问题发现</h4>
        ${kv(n(s.critical_house),'严重问题户数','1')}
        <div class="note r">需要反馈信息</div>
        ${kv(n(s.warning_house),'提示问题户数','1')}
        <div class="note y">请各公司自己加强注意</div>
        ${kv(n(s.problem_house),'问题涉及总户数')}
      </div>

      <!-- ④ 总体结论 -->
      <div class="sgrp res">
        <b>${s.ok_rate}%</b>
        <i>抽查符合率</i>
        <em>1 − 问题户 / 抽查户</em>
      </div>
    </div>
  </div>`;
}

function renderComp(d){
  $('compBox').innerHTML=d.companies.map(c=>{
    if(c.total_house===0 && c.sampled===0){
      return `<div class="cobox off">
        <div class="hd"><h3>${c.name}</h3><span class="tag2 t-off">本月未导入数据</span></div>
        <div class="txt dim">该分公司本月尚未导入安检明细表。</div></div>`;
    }
    const mc=(v,l,cls)=>`<div><div class="v ${cls}">${v}</div><div class="l">${l}</div></div>`;
    return `<div class="cobox" onclick="openCo('${c.code}')">
      <div class="acts">
        <button class="btn" title="图片用安检系统原图链接，文件几百KB，需联网查看" onclick="event.stopPropagation();dl('/api/report/download?type=company&code=${c.code}&month='+encodeURIComponent($('month').value.trim()),this)">下载</button>
        <button class="btn" title="导出抽查明细表（一户一行，照片只给链接，末列留空给公司填写反馈）" onclick="event.stopPropagation();dl('/api/report/xlsx?code=${c.code}&month='+encodeURIComponent($('month').value.trim()),this)">导出Excel</button>
        <button class="btn pri" onclick="event.stopPropagation();openCo('${c.code}',1)">查看报告</button>
      </div>
      <div class="hd"><h3>${c.name}</h3>
        ${c.pending_review>0?`<span class="tag2 t-wait">待人工审核 ${c.pending_review} 户</span>`
                          :`<span class="tag2 t-on">复核已完成</span>`}
        ${c.fp_excluded?`<span class="tag2 t-off">误判剔除 ${c.fp_excluded} 户</span>`:''}
      </div>
      <div class="metrics">
        ${mc(c.total_house.toLocaleString(),'当月入户','b')}
        ${mc((c.checkable_house!=null?c.checkable_house:c.total_house).toLocaleString(),'符合条件','b')}
        ${mc((c.done_house!=null&&c.done_house<c.sampled)?(c.done_house+'/'+c.sampled):c.sampled,
             (c.done_house!=null&&c.done_house<c.sampled)?'已判/抽查（未判完）':'本次抽查','b')}
        ${mc(c.rate+'%','覆盖率','d')}
        ${mc(c.reviewed,'已人工审核','g')}
        ${mc(c.critical_house,'严重问题户','r')}
        ${mc(c.warning_house,'提示问题户','y')}
      </div>
      <div class="bar"><i class="${c.critical_house?'r':(c.warning_house?'y':'g')}"
        style="width:${Math.min(100,(c.problem_house*100/c.sampled)||0)}%"></i></div>
    </div>`;
  }).join('');
}

function openCo(code, newTab){
  const u='/report/detail?company='+code+'&month='+encodeURIComponent($('month').value.trim());
  if(newTab) window.open(u,'_blank');
  else location.href=u;
}

$('btnLoad').onclick=load;
$('btnDlSum').onclick=e=>dl('/api/report/download?type=summary&month='
  +encodeURIComponent($('month').value.trim()), e.target);

// 导入公司回传的 Excel（只读「客户编号」+「公司反馈」两列，不改判定）
$('btnImp').onclick=()=>$('impFile').click();
$('impFile').onchange=async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  $('dlMsg').innerHTML='<span class="spin"></span> 正在读取文件并回填…';
  try{
    const buf=await f.arrayBuffer(), u8=new Uint8Array(buf);
    let bin=''; const CH=0x8000;
    for(let i=0;i<u8.length;i+=CH) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
    const r=await fetch('/api/report/xlsx/import',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({file:btoa(bin),filename:f.name})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.msg||'导入失败');
    let t=`<span class="tag2 t-on">✓ ${j.name||''} ${j.month?monLabel(j.month):''} 回填 ${j.updated} 户</span>`;
    if(j.skipped) t+=` <span class="tag2 t-off">重复跳过 ${j.skipped} 户</span>`;
    if(j.missing_n) t+=` <span class="tag2 t-wait">未匹配 ${j.missing_n} 户：`
      +`${(j.missing||[]).slice(0,5).join('、')}</span>`;
    $('dlMsg').innerHTML=t;
    load();
  }catch(err){ $('dlMsg').innerHTML=`<span class="tag2 t-wait">✗ ${err.message||err}</span>`; }
  finally{ e.target.value=''; }
};

// 月份下拉：从库里取可选月份（倒序，最新在前），支持按月切换查看
function monLabel(m){
  // '2026-09' -> '2026年9月'（月份去前导零，和报告正文口径一致）
  const p=String(m||'').split('-');
  return p.length===2?`${p[0]}年${parseInt(p[1],10)}月`:m;
}
async function initMonths(){
  const q=new URLSearchParams(location.search);
  let want=(q.get('month')||'').trim();
  let list=[];
  try{
    const r=await (await fetch('/api/months')).json();
    list=r.months||[];
  }catch(e){ list=[]; }
  const sel=$('month');
  if(!list.length){
    sel.innerHTML='<option value="">暂无数据</option>';
    return;
  }
  sel.innerHTML=list.map(m=>{
    const lab=monLabel(m.month);
    const tip=m.sampled?`已抽 ${m.sampled} 户`:'未抽查';
    return `<option value="${m.month}">${lab}（${tip}）</option>`;
  }).join('');
  // 优先用 URL 指定的月份；否则选已抽查过的最新月份，再退到最新月份
  const vals=list.map(m=>m.month);
  if(!want){
    const withS=list.find(m=>m.sampled>0);
    want=withS?withS.month:vals[0];
  }
  sel.value=vals.includes(want)?want:vals[0];
}

(async ()=>{ await initMonths(); await load(); })();
</script>
</body></html>
